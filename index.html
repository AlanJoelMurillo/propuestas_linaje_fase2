<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matour | Descubre tu próximo viaje</title>
  <meta name="description" content="Recreación del hero de Matour: encabezado de bienvenida y buscador de tours." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="hero">
    <!-- Fondo decorativo del hero (ilustración en SVG, sin dependencias externas) -->
    <div class="hero__background" aria-hidden="true">
      <img src="static/alabanza.jpeg" alt="">
    </div>
    <div class="hero__overlay" aria-hidden="true"></div>

    <!-- Navegación -->
    <nav class="navbar">
      <a class="navbar__logo" href="#">Linaje<span>Bendito</span></a>

      <ul class="navbar__links" id="navLinks">
        <li><a href="#">Campus</a></li>
        <li><a href="#">Ministerios</a></li>
        <li><a href="#">Culto</a></li>
        <li><a href="#">Eventos</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>

      <button class="navbar__toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="navLinks">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>

    <!-- Contenido principal del hero -->
    <div class="hero__content">
      <p class="hero__eyebrow">Bienvenido a Linaje Bendito</p>
      <h1 class="hero__title">Un estilo de vida<br />hecho iglesia</h1>
      <p class="hero__subtitle">
Somos diferentes historias, una misma familia y un mismo propósito: seguir a Jesús
      </p>

      <div class="hero__actions">
        <a class="btn btn--primary" href="#buscar">Bienvenida</a>
        <button class="btn btn--ghost" type="button" id="playVideoBtn">
          <span class="btn__icon" aria-hidden="true">▶</span>
          Ver en YouTube
        </button>
      </div>
    </div>

  </header>

  <script src="js/main.js"></script>
</body>
</html>
